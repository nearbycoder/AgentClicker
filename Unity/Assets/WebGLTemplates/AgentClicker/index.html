<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="description" content="Automate yourself out of a job. Keep the paycheck. An idle clicker about a developer who hands their whole job to AI agents.">
    <!-- added to the home screen, the game opens full-screen and landscape with its own icon: phones lose the browser's bars -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0B111B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Agent Clicker">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B111B'/%3E%3Cpath d='M16 5 27 16 16 27 5 16Z' fill='%234DD0E1'/%3E%3C/svg%3E">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0B111B; color: #E6ECF5;
                   font: 16px/1.4 "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
                   overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
                   -webkit-tap-highlight-color: transparent; }
      html { touch-action: none; }
      /* the game stays clear of a notch or camera cut-out held sideways; the page's colour fills the space beside it */
      #game { position: fixed; top: 0; bottom: 0; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
      /* the game takes every gesture: fast taps on SHIP CODE must not zoom, scroll or pull-to-refresh the page */
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0B111B; outline: none; touch-action: none; }
      .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 18px; background: #0B111B; text-align: center; padding: 24px; box-sizing: border-box; }
      .logo { font-weight: 800; font-size: clamp(40px, 8vw, 88px); line-height: 0.9; letter-spacing: -1px; }
      .logo span { color: #4DD0E1; display: block; }
      .tagline { color: #8A97AD; font-size: clamp(14px, 2vw, 20px); }
      #progress { width: min(420px, 70vw); height: 8px; border-radius: 4px; background: #1B2433; overflow: hidden; }
      #progress div { width: 0; height: 100%; background: #4DD0E1; transition: width 0.2s; }
      #status { color: #56627A; font-size: 14px; min-height: 1.4em; }
      /* a touch screen held upright: the game is laid out for landscape */
      #rotate { display: none; z-index: 3; }
      #rotate p { max-width: 360px; color: #C9D3E3; margin: 0; }
      #rotate .phone { width: 46px; height: 76px; border: 4px solid #4DD0E1; border-radius: 10px; animation: turn 2.4s ease-in-out infinite; }
      @keyframes turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) { #rotate { display: flex; } }
      @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; } }
      button { font: inherit; font-weight: 700; color: #0B111B; background: #4DD0E1; border: 0; border-radius: 10px;
               padding: 12px 22px; cursor: pointer; }
      #fullscreen { position: fixed; right: 12px; bottom: 12px; padding: 8px 12px; font-size: 13px; color: #C9D3E3;
                    background: rgba(27, 36, 51, 0.85); display: none; z-index: 1; }
      #fullscreen:hover { background: #2A3547; }
      /* the game can't start here: say why and what to try, instead of a progress bar that stops */
      #failed { display: none; max-width: 560px; }
      #failed h2 { margin: 0 0 8px; font-size: 22px; color: #FF7A7A; }
      #failed p { margin: 0 0 10px; color: #C9D3E3; }
      #failed code { display: block; white-space: pre-wrap; color: #8A97AD; font-size: 13px; margin-bottom: 14px; }
      #loading.failed #progress, #loading.failed #status { display: none; }
      #loading.failed #failed { display: block; }
      /* an error once the game is running: a bar along the top that can be closed */
      #error-bar { position: fixed; left: 0; right: 0; top: 0; z-index: 4; display: none; padding: 8px 44px 8px 12px;
                   background: #5A1D24; color: #FFD9D9; font-size: 14px; }
      #error-bar button { position: absolute; right: 6px; top: 4px; padding: 2px 10px; background: transparent; color: #FFD9D9; }
      /* a note under the loading bar: the last visit ended suddenly (most likely the browser ran out of memory) */
      #notice { display: none; max-width: 520px; color: #F2C14E; font-size: 14px; }

      /* On-screen touch controls, phones and tablets only: shown while touch is the input in use (html.touch-ui), hidden
         again by a key, a mouse or a gamepad. Every button is at least 48 CSS px (Apple asks for 44 pt), sits inside the
         safe area, and takes its own finger, so SHIP can be drummed with two while another button is held. The game says
         which ones apply (html[data-touch-screen], data-touch-ship, ...). */
      #touch-controls { display: none; position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      html.touch-ui[data-touch-screen] #touch-controls { display: block; }
      .tc-col { position: absolute; display: flex; flex-direction: column; gap: 10px; }
      #tc-left { left: calc(env(safe-area-inset-left, 0px) + 8px); top: calc(env(safe-area-inset-top, 0px) + 8px); }
      #tc-right { right: calc(env(safe-area-inset-right, 0px) + 8px); top: calc(env(safe-area-inset-top, 0px) + 8px); }
      #touch-controls button { pointer-events: auto; touch-action: none; width: 48px; height: 48px; padding: 0;
                               display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
                               color: #E6ECF5; background: rgba(11, 17, 27, 0.78); border: 1px solid rgba(77, 208, 225, 0.45);
                               border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); font-size: 9px; font-weight: 700;
                               letter-spacing: 0.3px; text-transform: uppercase; }
      #touch-controls button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
                                   stroke-linecap: round; stroke-linejoin: round; }
      #touch-controls button.down { background: #4DD0E1; color: #0B111B; }
      #tc-ship { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 8px);
                 bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: 76px !important; height: 76px !important;
                 border-radius: 50% !important; background: rgba(77, 208, 225, 0.92) !important; color: #0B111B !important;
                 border: 2px solid #B2F1F8 !important; font-size: 14px !important; letter-spacing: 0.5px !important; }
      #tc-ship.down { background: #B2F1F8 !important; transform: scale(0.94); }
      /* which buttons the current screen has */
      #tc-view, #tc-zoom, #tc-ship, #tc-menu { display: none !important; }
      html[data-touch-screen="monitor"] #tc-view, html[data-touch-screen="office"] #tc-view,
      html[data-touch-screen="monitor"] #tc-zoom,
      html[data-touch-screen="monitor"] #tc-menu, html[data-touch-screen="office"] #tc-menu, html[data-touch-screen="busy"] #tc-menu { display: flex !important; }
      html[data-touch-ship="true"][data-touch-screen="monitor"] #tc-ship,
      html[data-touch-ship="true"][data-touch-screen="office"] #tc-ship { display: flex !important; }
      html[data-touch-screen="title"] #tc-mute, html[data-touch-screen="menu"] #tc-mute { display: none; }
      html[data-touch-screen="office"] #tc-view .tc-office, html[data-touch-screen="monitor"] #tc-view .tc-desk,
      html[data-touch-muted="true"] #tc-mute .tc-on, html[data-touch-muted="false"] #tc-mute .tc-off { display: none; }
      html[data-touch-zoom="0"] #tc-zoom .tc-z1, html[data-touch-zoom="0"] #tc-zoom .tc-z2,
      html[data-touch-zoom="1"] #tc-zoom .tc-z0, html[data-touch-zoom="1"] #tc-zoom .tc-z2,
      html[data-touch-zoom="2"] #tc-zoom .tc-z0, html[data-touch-zoom="2"] #tc-zoom .tc-z1 { display: none; }
      @media (min-width: 900px) and (min-height: 600px) {
        #touch-controls button { width: 56px; height: 56px; font-size: 10px; }
        #tc-ship { width: 92px !important; height: 92px !important; font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <div id="game"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading" class="overlay">
      <div class="logo">AGENT<span>CLICKER</span></div>
      <div class="tagline">Automate yourself out of a job. Keep the paycheck.</div>
      <div id="progress"><div></div></div>
      <div id="status">Loading…</div>
      <div id="notice" role="status"></div>
      <div id="failed" role="alert">
        <h2 id="failed-title">Agent Clicker can't start</h2>
        <p id="failed-help"></p>
        <code id="failed-detail"></code>
        <button onclick="location.reload()">Try again</button>
      </div>
    </div>
    <div id="error-bar" role="alert"><span></span><button title="Close" onclick="this.parentNode.style.display='none'">✕</button></div>
    <div id="rotate" class="overlay">
      <div class="phone"></div>
      <p>Turn your device sideways. Agent Clicker is laid out for a wide screen.</p>
    </div>
    <button id="fullscreen" title="Fullscreen">⛶ Fullscreen</button>
    <div id="touch-controls" aria-label="Touch controls">
      <div id="tc-left" class="tc-col">
        <button id="tc-menu" data-cmd="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Menu</button>
        <button id="tc-mute" data-cmd="mute" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="tc-on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="tc-off" d="M16 9l5 6M21 9l-5 6"/></svg>Sound</button>
      </div>
      <div id="tc-right" class="tc-col">
        <button id="tc-view" data-cmd="view" aria-label="Look around the office, or back to the desk"><svg viewBox="0 0 24 24"><path class="tc-office" d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle class="tc-office" cx="12" cy="12" r="2.5"/><rect class="tc-desk" x="3" y="4" width="18" height="12" rx="1.5"/><path class="tc-desk" d="M9 20h6M12 16v4"/></svg><span class="tc-office">Office</span><span class="tc-desk">Desk</span></button>
        <button id="tc-zoom" data-cmd="zoom" aria-label="Zoom into the monitor"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/><path class="tc-z0" d="M10.5 7.5v6M7.5 10.5h6"/><path class="tc-z1 tc-z2" d="M7.5 10.5h6"/></svg><span class="tc-z0">Zoom</span><span class="tc-z1">Store</span><span class="tc-z2">All</span></button>
      </div>
      <button id="tc-ship" data-cmd="ship" aria-label="Ship code">Ship</button>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var statusEl = document.querySelector("#status");
      var bar = document.querySelector("#progress div");

      var started = false;
      // Before the game is running an error stops the load: the loading screen says so. Afterwards it's a bar along the top.
      function fail(title, help, detail) {
        document.querySelector("#failed-title").textContent = title;
        document.querySelector("#failed-help").textContent = help;
        document.querySelector("#failed-detail").textContent = detail || "";
        var loading = document.querySelector("#loading");
        loading.classList.add("failed");
        loading.style.display = "flex";
      }
      function showBanner(msg, type) {
        if (type !== "error") { console.warn(msg); return; }
        if (!started) {
          fail("Agent Clicker can't start", "Something went wrong while loading. Reloading usually fixes it; if not, try another browser.", String(msg));
          return;
        }
        var errorBar = document.querySelector("#error-bar");
        errorBar.querySelector("span").textContent = "Something went wrong: " + msg + " Your progress is saved; reloading the page should fix it.";
        errorBar.style.display = "block";
      }

      // Unity 6 needs WebGL 2. Check first, so a browser without it gets a clear answer instead of a stalled bar.
      function hasWebGL2() {
        try { return !!(window.WebGL2RenderingContext && document.createElement("canvas").getContext("webgl2")); }
        catch (e) { return false; }
      }

      // Render at the screen's real pixel density (3x on an iPhone, 2x on a Retina laptop) up to a 4K budget
      // (3840x2160 pixels): phones, tablets and laptops are sharp, and a huge high-DPI window never renders beyond 4K.
      // Never below one pixel per CSS pixel.
      var maxPixels = 3840 * 2160;
      // Phones and tablets: at most 2.5x and about 1920x1200 pixels. An iPhone's 3x drew 2.3 million pixels on a 6-inch
      // screen, and every render target the game keeps is that size: memory a phone's browser closes tabs over. (2.5x, not
      // 2x: they start on Low, which renders at 85%, and the monitor's small text needs the pixels.)
      var touchFirst = matchMedia("(pointer: coarse)").matches && !matchMedia("(any-pointer: fine)").matches;
      if (touchFirst) maxPixels = 1920 * 1200;
      function pixelRatio() {
        var dpr = Math.min(window.devicePixelRatio || 1, touchFirst ? 2.5 : 8);
        var css = Math.max(1, window.innerWidth * window.innerHeight);
        return Math.max(1, Math.min(dpr, Math.sqrt(maxPixels / css)));
      }

      var buildUrl = "Build";
      var config = {
        // test tools pass player arguments in the URL (?arg=-soak&arg=&arg=30); players never need this
        arguments: new URLSearchParams(location.search).getAll("arg"),
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // the game flushes IndexedDB itself once each save is complete (Platform.SyncFileSystem); syncing after every
        // single file write as well ran up to six syncs at once
        autoSyncPersistentDataPath: false,
        devicePixelRatio: pixelRatio(),
      };

      // test tools only (Tools/websoak.mjs detached): ?report=/path posts each [Soak] sample the game logs, with the
      // page's JS heap and the WebGL id tables, to that path on this server, so a long run needs no DevTools connection. Installed before the
      // loader, which keeps its own reference to console.log.
      var report = new URLSearchParams(location.search).get("report");
      if (report && report.charAt(0) === "/") {
        var log = console.log;
        console.log = function () {
          log.apply(console, arguments);
          var text = String(arguments[0]);
          if (text.indexOf("[Soak]") !== 0) return;
          var mem = performance.memory;
          fetch(report, { method: "POST", body: JSON.stringify({ text: text, js: mem ? mem.usedJSHeapSize : -1,
                                                                 jsTotal: mem ? mem.totalJSHeapSize : -1,
                                                                 gl: window.agentClickerGL ? window.agentClickerGL() : null }) })
            .catch(function () {});
        };
      }

      // the Fullscreen button shows on the title screen only (the game says when); in the game the pause menu has one
      var fsButton = document.querySelector("#fullscreen"), fsReady = false, fsWanted = true;
      function showFsButton() { fsButton.style.display = fsWanted && fsReady ? "block" : "none"; }
      window.agentClickerFullscreenButton = function (show) {
        fsWanted = show;
        // the game calls this on entering and leaving the title screen; Tools/check-pages.mjs waits for "title"
        document.documentElement.dataset.screen = show ? "title" : "game";
        showFsButton();
      };

      // ---- phones and tablets ----
      var root = document.documentElement;
      // iOS Safari ignores user-scalable=no: stop pinch-zooming and double-tap-zooming the page (the game has its own pinch)
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("touchmove", function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
      document.addEventListener("contextmenu", function (e) { if (e.target.closest && e.target.closest("#touch-controls")) e.preventDefault(); });

      // Sound starts with the first tap: Safari only lets a page start audio inside a touchend, click or key handler, and
      // the engine's own retry runs on a timer, which doesn't count. Every audio context the page makes is resumed there.
      var audioContexts = [];
      ["AudioContext", "webkitAudioContext"].forEach(function (name) {
        var Base = window[name];
        if (!Base) return;
        var Wrapped = function (options) {
          var ctx = options === undefined ? new Base() : new Base(options);
          audioContexts.push(ctx);
          return ctx;
        };
        Wrapped.prototype = Base.prototype;
        window[name] = Wrapped;
      });
      function unlockAudio() {
        audioContexts.forEach(function (ctx) { if (ctx.state === "suspended") ctx.resume().catch(function () {}); });
      }
      ["touchend", "pointerup", "click", "keydown"].forEach(function (t) { document.addEventListener(t, unlockAudio, true); });
      window.agentClickerAudio = function () { return audioContexts.map(function (c) { return c.state; }).join(",") || "none"; }; // for tests

      // The touch controls show on a phone or tablet, or once a finger touches the screen, and hide when a key, a mouse
      // or a gamepad is used. A tap is followed by emulated mouse events in some browsers, so the mouse counts only once
      // the fingers have been off the screen for a moment.
      var lastTouch = touchFirst ? Date.now() : -1e9;
      function touchUi(on) { root.classList.toggle("touch-ui", on); }
      touchUi(touchFirst);
      document.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "touch" || e.pointerType === "pen") { lastTouch = Date.now(); touchUi(true); }
        else if (e.pointerType === "mouse" && Date.now() - lastTouch > 800) touchUi(false);
      }, true);
      document.addEventListener("touchstart", function () { lastTouch = Date.now(); touchUi(true); }, { capture: true, passive: true });
      var mouseAt = null; // where the mouse was last seen (Safari reports no movementX for it)
      document.addEventListener("pointermove", function (e) {
        if (e.pointerType !== "mouse") return;
        var moved = mouseAt ? Math.abs(e.clientX - mouseAt.x) + Math.abs(e.clientY - mouseAt.y) : 0;
        mouseAt = { x: e.clientX, y: e.clientY };
        if (moved > 2 && Date.now() - lastTouch > 800) touchUi(false);
      }, true);
      document.addEventListener("keydown", function () { touchUi(false); }, true);
      window.addEventListener("gamepadconnected", function pollPads() {
        (function poll() {
          var pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (var i = 0; i < pads.length; i++) {
            var p = pads[i];
            if (!p) continue;
            if (p.buttons.some(function (b) { return b.pressed; }) || p.axes.some(function (a) { return Math.abs(a) > 0.5; })) touchUi(false);
          }
          if (pads.length && Array.prototype.some.call(pads, function (p) { return p; })) requestAnimationFrame(poll);
        })();
      });
      // the game says which buttons apply now (Platform.SetTouchState)
      window.agentClickerTouchState = function (json) {
        try {
          var st = JSON.parse(json);
          root.dataset.touchScreen = st.screen;
          root.dataset.touchShip = String(!!st.ship);
          root.dataset.touchMuted = String(!!st.muted);
          root.dataset.touchZoom = String(st.zoom | 0);
        } catch (e) { console.warn("touch state: " + e); }
      };
      function send(cmd) { if (window.unityInstance) window.unityInstance.SendMessage("Game", "TouchButton", cmd); }
      Array.prototype.forEach.call(document.querySelectorAll("#touch-controls button"), function (b) {
        var cmd = b.dataset.cmd, fingers = 0;
        b.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          lastTouch = Date.now();
          try { b.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
          fingers++;
          b.classList.add("down");
          if (navigator.vibrate && cmd === "ship") navigator.vibrate(8);
          send(cmd === "ship" ? "ship-down" : cmd);
        });
        var up = function () {
          if (fingers === 0) return;
          fingers = Math.max(0, fingers - 1);
          if (fingers > 0) return;
          b.classList.remove("down");
          if (cmd === "ship") send("ship-up");
        };
        b.addEventListener("pointerup", up);
        b.addEventListener("pointercancel", up);
        document.addEventListener("visibilitychange", function () { if (document.hidden) { fingers = 1; up(); } });
      });

      // A tab the browser closed for using too much memory (iOS does this without a word) comes back as a reload: say so,
      // instead of a dead tab. The page marks itself as running while it's visible, and clears the mark when it's hidden
      // or closed; a mark still there on the next load means the last visit ended while the game was on screen.
      var aliveKey = "agentclicker.alive";
      var store = null;
      try { store = window.localStorage; } catch (e) { /* storage blocked */ }
      var crashed = false;
      try { crashed = !!(store && store.getItem(aliveKey) && Date.now() - Number(store.getItem(aliveKey)) < 10 * 60 * 1000); } catch (e) { /* fine */ }
      if (crashed) {
        var notice = document.querySelector("#notice");
        notice.textContent = "The game closed unexpectedly last time, most likely because the browser ran out of memory. " +
          "If it happens again, close other tabs, or choose Settings → Graphics → Low.";
        notice.style.display = "block";
        console.warn("[Page] the last visit ended while the game was on screen (the tab may have run out of memory)");
      }
      var aliveTimer = 0;
      function markAlive(on) {
        try {
          clearInterval(aliveTimer);
          if (!store) return;
          if (!on) { store.removeItem(aliveKey); return; }
          store.setItem(aliveKey, String(Date.now()));
          aliveTimer = setInterval(function () { store.setItem(aliveKey, String(Date.now())); }, 5000);
        } catch (e) { /* fine */ }
      }
      document.addEventListener("visibilitychange", function () { markAlive(started && !document.hidden); });
      window.addEventListener("pagehide", function () { markAlive(false); });
      window.addEventListener("pageshow", function () { markAlive(started && !document.hidden); });

      // the browser took the graphics away (out of GPU memory, or the GPU reset): the game can't draw again without a reload
      canvas.addEventListener("webglcontextlost", function () {
        markAlive(false);
        fail("The game's graphics were reset", "The browser took back the graphics memory (this can happen on phones with " +
             "many tabs open). Your progress is saved; reload to carry on.", "WebGL context lost.");
      });

      function start() {
        var script = document.createElement("script");
        script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            bar.style.width = Math.round(100 * progress) + "%";
            statusEl.textContent = progress < 0.9 ? "Loading… " + Math.round(100 * progress) + "%" : "Starting CorpOS…";
          }).then(function (unityInstance) {
            started = true;
            window.unityInstance = unityInstance;
            markAlive(!document.hidden);
            // the budget depends on the window size: follow resizes and phone rotation
            window.addEventListener("resize", function () { unityInstance.Module.devicePixelRatio = pixelRatio(); });
            document.querySelector("#loading").style.display = "none";
            // iPhones have no fullscreen for pages; there "Add to Home Screen" is the way to lose the browser bars
            fsReady = document.fullscreenEnabled || document.webkitFullscreenEnabled;
            fsButton.onclick = function () { unityInstance.SetFullscreen(1); };
            showFsButton();
            canvas.focus();
          }).catch(function (message) {
            showBanner(String(message), "error");
          });
        };
        script.onerror = function () {
          fail("Agent Clicker couldn't be downloaded", "The game files didn't arrive. Check your connection and try again.", script.src);
        };
        document.body.appendChild(script);
      }

      if (hasWebGL2()) start();
      else fail("Your browser can't show 3D graphics here",
                "Agent Clicker needs WebGL 2. It's in every current version of Chrome, Edge, Firefox and Safari (15 or later), " +
                "but it can be turned off: check that hardware acceleration is on in your browser's settings, or try another browser.",
                "WebGL 2 is not available.");
    </script>
  </body>
</html>
